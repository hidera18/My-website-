<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد كلمات المرور - الأدوات الذكية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .tool-container {
            background: var(--card-bg, #ffffff);
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 550px;
            margin: 0 auto 50px auto;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light, #64748b);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .pass-display {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .pass-display input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
            background: #f8fafc;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            text-align: right;
        }
        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: 600;
        }
        .btn {
            background: var(--primary-color, #2563eb);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }
        .btn-copy {
            background: #10b981;
            width: auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <header class="main-header" style="padding: 30px 20px; margin-bottom: 30px; border-radius: 0 0 25px 25px;">
        <h1>🔐 توليد كلمات المرور</h1>
        <p>أنشئ كلمات مرور قوية، آمنة، وصعبة الاختراق</p>
    </header>

    <main class="container">
        <a href="../index.html" class="back-btn">&rarr; العودة إلى القائمة الرئيسية</a>

        <div class="tool-container">
            <div class="pass-display">
                <input type="text" id="pass-output" readonly placeholder="اضغط توليد...">
                <button class="btn btn-copy" id="copy-btn">نسخ 📋</button>
            </div>

            <div class="options">
                <div class="option-row">
                    <label>طول كلمة المرور (<span id="len-val">12</span>):</label>
                    <input type="range" id="length" min="6" max="32" value="12">
                </div>
                <div class="option-row">
                    <label>تضمين أحرف كبيرة (A-Z)</label>
                    <input type="checkbox" id="uppercase" checked>
                </div>
                <div class="option-row">
                    <label>تضمين أرقام (0-9)</label>
                    <input type="checkbox" id="numbers" checked>
                </div>
                <div class="option-row">
                    <label>تضمين رموز خاصة (!@#$%^&*)</label>
                    <input type="checkbox" id="symbols" checked>
                </div>
            </div>

            <button class="btn" id="generate-btn">توليد كلمة مرور جديدة ⚡</button>
        </div>
    </main>

    <script src="../script.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const output = document.getElementById('pass-output');
            const lengthInput = document.getElementById('length');
            const lenVal = document.getElementById('len-val');
            const upperInput = document.getElementById('uppercase');
            const numInput = document.getElementById('numbers');
            const symInput = document.getElementById('symbols');
            const genBtn = document.getElementById('generate-btn');
            const copyBtn = document.getElementById('copy-btn');

            lengthInput.addEventListener('input', () => lenVal.textContent = lengthInput.value);

            function generatePassword() {
                const charsLower = "abcdefghijklmnopqrstuvwxyz";
                const charsUpper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                const charsNum = "0123456789";
                const charsSym = "!@#$%^&*()_+-=[]{}|;:,.<>?";

                let validChars = charsLower;
                if (upperInput.checked) validChars += charsUpper;
                if (numInput.checked) validChars += charsNum;
                if (symInput.checked) validChars += charsSym;

                let password = "";
                for (let i = 0; i < lengthInput.value; i++) {
                    const randomIndex = Math.floor(Math.random() * validChars.length);
                    password += validChars[randomIndex];
                }
                output.value = password;
            }

            genBtn.addEventListener('click', generatePassword);
            copyBtn.addEventListener('click', () => {
                if(!output.value) return;
                if (typeof copyToClipboard === 'function') {
                    copyToClipboard(output.value);
                } else {
                    navigator.clipboard.writeText(output.value);
                    alert("تم النسخ بنجاح!");
                }
            });

            generatePassword(); // توليد تلقائي عند الفتح
        });
    </script>
</body>
</html>
