<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الكلمات والحروف - الأدوات الذكية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .tool-container {
            background: var(--card-bg, #ffffff);
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 700px;
            margin: 0 auto 50px auto;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light, #64748b);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1.1rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
            margin-bottom: 20px;
        }
        textarea:focus { border-color: var(--primary-color, #2563eb); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            text-align: center;
        }
        .stat-card {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .stat-card h4 { font-size: 1.8rem; color: var(--primary-color, #2563eb); }
        .stat-card p { font-size: 0.9rem; color: #64748b; }
    </style>
</head>
<body>
    <header class="main-header" style="padding: 30px 20px; margin-bottom: 30px; border-radius: 0 0 25px 25px;">
        <h1>📝 حاسبة الكلمات والحروف</h1>
        <p>احسب عدد الكلمات، الحروف، والأسطر في نصك فورياً</p>
    </header>

    <main class="container">
        <a href="../index.html" class="back-btn">&rarr; العودة إلى القائمة الرئيسية</a>

        <div class="tool-container">
            <textarea id="text-input" placeholder="اكتب أو الصق النص هنا..."></textarea>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h4 id="count-words">0</h4>
                    <p>كلمة</p>
                </div>
                <div class="stat-card">
                    <h4 id="count-chars">0</h4>
                    <p>حرف</p>
                </div>
                <div class="stat-card">
                    <h4 id="count-lines">0</h4>
                    <p>سطر</p>
                </div>
            </div>
        </div>
    </main>

    <script src="../script.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const textInput = document.getElementById('text-input');
            const countWords = document.getElementById('count-words');
            const countChars = document.getElementById('count-chars');
            const countLines = document.getElementById('count-lines');

            textInput.addEventListener('input', () => {
                const text = textInput.value;
                countChars.textContent = text.length;
                
                const words = text.trim().split(/\s+/).filter(word => word.length > 0);
                countWords.textContent = words.length;

                const lines = text.length > 0 ? text.split('\n').length : 0;
                countLines.textContent = lines;
            });
        });
    </script>
</body>
</html>
